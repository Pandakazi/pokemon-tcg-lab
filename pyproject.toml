[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-tcg-lab"
version = "0.1.1"
description = "Private local Pokemon TCG deck tools over MCP"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "httpx==0.28.1", "python-dotenv==1.2.3"]

[project.optional-dependencies]
web = ["fastapi==0.141.1", "uvicorn==0.53.0"]
dev = ["pytest==9.1.1"]
desktop = ["PySide6==6.11.2"]
build = ["pyinstaller==6.22.3"]

[project.scripts]
pokemon-tcg-lab = "tcg_lab.server:main"
pokelab = "pokelab.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tcg_lab = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
