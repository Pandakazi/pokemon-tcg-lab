[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-tcg-lab"
version = "0.1.1"
description = "Private local Pokemon TCG deck tools over MCP"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "httpx==0.28.1", "python-dotenv==1.2.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
pokemon-tcg-lab = "tcg_lab.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tcg_lab = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
